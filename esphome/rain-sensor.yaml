# USB, 3 fios: VCC, GND, AO. Sem DO, sem bateria.
# Chuva e umidade vêm da tensão do AO.

substitutions:
  device_name: rain-sensor
  friendly_name: Rain Sensor
  rain_analog_pin: GPIO36
  rain_voltage_wet: "2.50"
  rain_voltage_dry: "2.90"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  ap:
    ssid: "ESPHome Rain Fallback"
    password: !secret fallback_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: rain_event_sent
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: last_rain_text
    type: std::string
    restore_value: yes
    initial_value: '"Nunca"'

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: analog_threshold
    id: raining
    name: "Chuva"
    device_class: moisture
    icon: mdi:weather-pouring
    sensor_id: rain_plate_voltage
    threshold:
      upper: ${rain_voltage_dry}
      lower: ${rain_voltage_wet}
    filters:
      - invert
      - delayed_on: 2s
      - delayed_off: 20s
    on_press:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (now.is_valid()) {
              char buf[32];
              now.strftime(buf, sizeof(buf), "%d/%m/%Y %H:%M");
              id(last_rain_text) = std::string(buf);
            }
        - if:
            condition:
              lambda: "return !id(rain_event_sent);"
            then:
              - logger.log: "Chuva detectada"
              - homeassistant.event:
                  event: esphome.its_raining
              - lambda: id(rain_event_sent) = true;
    on_release:
      then:
        - lambda: id(rain_event_sent) = false;

sensor:
  - platform: adc
    id: rain_plate_voltage
    pin: ${rain_analog_pin}
    name: "Tensão da placa"
    icon: mdi:sine-wave
    entity_category: diagnostic
    attenuation: 12db
    samples: 10
    sampling_mode: avg
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: copy
    source_id: rain_plate_voltage
    name: "Umidade da placa"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.17 -> 0
          - 1.25 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "Sinal Wi-Fi"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic

  - platform: template
    name: "Estado"
    icon: mdi:weather-partly-rainy
    lambda: |-
      if (id(raining).state) {
        return std::string("Chovendo");
      }
      return std::string("Seco");
    update_interval: 1s

  - platform: template
    name: "Última chuva"
    icon: mdi:clock-outline
    lambda: 'return id(last_rain_text);'
    update_interval: 60s

button:
  - platform: restart
    name: "Reiniciar"
    entity_category: diagnostic
    icon: mdi:restart
