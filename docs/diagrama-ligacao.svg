<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Pinos do DevKit 30 pinos">
  <rect width="1000" height="420" fill="#f1f5f9"/>
  <text x="500" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Onde achar os pinos (USB em cima)</text>

  <rect x="80" y="70" width="360" height="300" rx="18" fill="#1e293b"/>
  <rect x="200" y="82" width="120" height="28" rx="6" fill="#38bdf8"/>
  <text x="260" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">USB</text>

  <text x="160" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">ESQUERDA</text>
  <text x="160" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">EN</text>
  <text x="160" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#4ade80">VP  -&gt; AO</text>
  <text x="160" y="236" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">VN</text>
  <text x="160" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">D34</text>
  <text x="160" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">D35</text>
  <text x="160" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">D32 (nao usa)</text>

  <text x="340" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8">DIREITA</text>
  <text x="340" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f87171">3V3  -&gt; VCC</text>
  <text x="340" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#e5e7eb">GND  -&gt; GND</text>
  <text x="340" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">D15 ...</text>

  <rect x="500" y="90" width="440" height="260" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="720" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Lembrete</text>
  <text x="540" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">VP e o segundo pino da esquerda.</text>
  <text x="540" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">Nunca ligue o VCC do MH-RD no VP.</text>
  <text x="540" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">DO do modulo fica sem fio.</text>
  <text x="540" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a">Placa de cobre inclinada, para o ceu.</text>
  <text x="540" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">ESP32 + LM393 na caixa. So as trilhas na chuva.</text>
</svg>
